name: Bug report
description: 报告可重复的软件问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交密码、访问令牌、个人文件或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: SafeAwake 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与 Mac 型号
      placeholder: 例如 macOS 15.7，MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请列出最少且完整的重现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: lid
    attributes:
      label: 使用状态
      options:
        - label: 问题发生时 MacBook 上盖保持打开
        - label: 问题发生时电脑已接通电源
