name: Feature request
description: 提议一个安全、可逆的新功能
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 这个功能要解决什么实际问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与电池影响
      description: 是否会影响睡眠、合盖行为、电池或散热？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 安全边界
      options:
        - label: 该功能不需要绕过物理合盖睡眠
          required: true
        - label: 该功能不需要管理员权限或持久修改电源设置
          required: true
